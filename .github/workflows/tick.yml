# Sveglia dei bot-canale Telegram.
#
# Chiama una rotta HTTP del gestionale che, se e' scaduta una fascia oraria, pubblica
# il messaggio previsto nel canale giusto. Il gestionale e' idempotente: se due sveglie
# suonano insieme, il messaggio parte comunque una volta sola.
#
# Repository PUBBLICO: i minuti Actions sono illimitati, quindi si puo' girare ogni 5
# minuti 24 ore su 24. Per la stessa ragione i LOG DI QUESTI RUN SONO PUBBLICI: qui
# non si stampa mai il corpo della risposta (conterrebbe nomi e testi), solo il codice
# HTTP. L'indirizzo sta nelle Variables e la chiave nei Secrets del repository, che
# pubblici non sono.

name: sveglia-bot-telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sveglia il gestionale
        env:
          TICK_URL: ${{ vars.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 60 --retry 2 --retry-delay 5 \
            "${TICK_URL}")
          echo "HTTP ${code}"
          test "${code}" = "200"
